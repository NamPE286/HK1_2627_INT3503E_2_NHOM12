# Chạy toàn bộ stack: docker compose up --build → http://localhost:8080 (web), http://localhost:8000/docs (API)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trafficlex
      POSTGRES_PASSWORD: trafficlex
      POSTGRES_DB: trafficlex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficlex -d trafficlex"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://trafficlex:trafficlex@db:5432/trafficlex
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-change-me-123}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      UPLOAD_DIR: /app/api/storage
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads:/app/api/storage]
    ports: ["8000:8000"]

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata: {}
  uploads: {}
