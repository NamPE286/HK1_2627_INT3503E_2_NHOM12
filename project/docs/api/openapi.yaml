openapi: 3.1.0
info:
  title: LexImpact API
  version: 1.0.0
  summary: Đánh giá tác động của dự thảo văn bản quy phạm pháp luật tới hệ thống văn bản hiện hành.
  description: |
    API contract (design-first) của LexImpact — bài tập lớn INT3505E_2, Nhóm 12.

    ## Bài toán
    Người soạn thảo chính sách cần biết một **dự thảo** sửa đổi, bổ sung, thay thế, bãi bỏ những điều/khoản/điểm nào
    của văn bản hiện hành; điều khoản nào khác đang **dẫn chiếu** tới chúng; **chế tài** thay đổi trước/sau ra sao;
    có **xung đột** giữa các chỉ dẫn thay đổi hay không. API cung cấp:
    1. Workspace chứa văn bản hiện hành (`kind=IN_FORCE`) và dự thảo (`kind=DRAFT`), file gốc PDF/DOCX/TXT.
    2. Nội dung có cấu trúc Chương/Mục/Điều/Khoản/Điểm (`/content`) → điều khoản trích dẫn được (`/provisions`).
    3. Chỉ dẫn thay đổi của dự thảo (`/change-instructions`) trỏ tới điều khoản hiện hành.
    4. Báo cáo tác động (`/impact-report`) và lược đồ tác động (`/diagrams`).
    5. Chia sẻ workspace cho người khác với quyền chỉ xem (`/members`, role `VIEWER`).

    ## Quickstart
    1. Đăng ký: `POST /api/auth/sign-up/email` `{ "email", "password", "name" }` (Better Auth — xem `/api/auth/reference`).
       Mỗi tài khoản mới có sẵn một workspace của riêng mình.
    2. Đăng nhập: `POST /api/auth/sign-in/email` → cookie phiên httpOnly (web) hoặc header `set-auth-token`
       dùng làm `Authorization: Bearer <token>`.
    3. `GET /workspaces` → lấy `workspace_id` → `POST /workspaces/{workspace_id}/legal-documents` (văn bản hiện hành),
       `PUT /legal-documents/{document_id}/content` → tạo dự thảo (`kind=DRAFT`) → `POST /legal-documents/{draft_id}/change-instructions`
       → `GET /legal-documents/{draft_id}/impact-report`.

    ## Phân quyền
    | | Chưa đăng nhập | OWNER | VIEWER | Không phải thành viên |
    |---|---|---|---|---|
    | Đọc | 401 | ✓ | ✓ | 404 |
    | Ghi, chia sẻ | 401 | ✓ | 403 | 404 |

    ## Quy ước
    - Path `kebab-case` số nhiều; JSON và query `snake_case`; enum `UPPER_SNAKE_CASE`; thời gian ISO 8601.
    - Collection nằm dưới workspace (`/workspaces/{workspace_id}/...`); item có ID toàn cục truy cập phẳng
      (`/legal-documents/{document_id}`, `/provisions/{provision_id}`…) để path không sâu quá 2 cấp resource.
    - Collection trả `{ data, pagination }`, phân trang `page` / `page_size` (≤ 100), header `Link`.
    - Lỗi trả `application/problem+json` (RFC 9457) với `code` ổn định.
    - Tài nguyên soạn thảo (`content`, `diagrams`) dùng ETag + `If-Match` (optimistic concurrency).
    - v1 chỉ thay đổi theo hướng bổ sung; client bỏ qua field không biết.
  contact:
    name: Nhóm 12 — INT3505E_2
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Users
    description: Người dùng hiện tại (đăng ký/đăng nhập do Better Auth xử lý tại `/api/auth/*`).
  - name: Workspaces
    description: Workspace và chia sẻ quyền xem (read-only).
  - name: LegalDocuments
    description: Văn bản hiện hành và dự thảo; nội dung Điều/Khoản/Điểm; revision.
  - name: SourceFiles
    description: File gốc (PDF/DOCX/TXT) của văn bản.
  - name: Provisions
    description: Điều khoản dẫn xuất từ nội dung (chỉ đọc) và dẫn chiếu giữa các điều khoản.
  - name: ChangeInstructions
    description: Chỉ dẫn thay đổi của dự thảo tới điều khoản hiện hành.
  - name: ImpactReports
    description: Báo cáo tác động của dự thảo (tính toán, chỉ đọc).
  - name: SanctionRules
    description: Chế tài gắn với điều khoản (dùng để so sánh trước/sau trong báo cáo tác động).
  - name: Diagrams
    description: Lược đồ tác động vẽ thủ công.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ───────────────────────────── Users ─────────────────────────────
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Người dùng đang đăng nhập
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Workspaces ─────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: Workspace của tôi và workspace được chia sẻ cho tôi
      parameters:
        - name: role
          in: query
          description: Lọc theo vai trò của tôi trong workspace.
          schema: { $ref: '#/components/schemas/MemberRole' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Tạo workspace mới (người tạo là OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
            example: { name: Dự thảo sửa đổi nghị định xử phạt }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /workspaces/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Chi tiết workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Đổi tên workspace (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Xoá workspace và toàn bộ dữ liệu (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: Danh sách thành viên (chủ và người được chia sẻ)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workspaces]
      operationId: shareWorkspace
      summary: Chia sẻ workspace cho người khác với quyền chỉ xem (OWNER)
      description: |
        Người được chia sẻ phải đã có tài khoản (nếu không ⇒ 422 `MEMBER_NOT_REGISTERED`).
        1.0.0 chỉ hỗ trợ `role: VIEWER` (read-only); đã là thành viên ⇒ 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
            example: { email: tham.dinh@example.com, role: VIEWER }
      responses:
        '201':
          description: Đã chia sẻ.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceMember
      summary: Thu hồi quyền xem (OWNER) hoặc tự rời workspace (VIEWER)
      description: Không thể xoá OWNER ⇒ 409 `CANNOT_REMOVE_OWNER`.
      responses:
        '204': { description: Đã thu hồi. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Legal documents ─────────────────────────────
  /workspaces/{workspace_id}/legal-documents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [LegalDocuments]
      operationId: listLegalDocuments
      summary: Liệt kê / tìm văn bản hiện hành và dự thảo trong workspace
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Query'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DocumentKind' }
        - name: doc_type
          in: query
          schema: { $ref: '#/components/schemas/DocType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: number
          in: query
          description: Lọc chính xác theo số hiệu.
          schema: { type: string }
        - name: issued_after
          in: query
          schema: { type: string, format: date }
        - name: issued_before
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: 'Cho phép: `issued_date`, `effective_date`, `number`, `created_at`, `updated_at` (tiền tố `-` = giảm dần). Mặc định `-updated_at`.'
          schema: { type: string, default: -updated_at }
      responses:
        '200':
          description: OK
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [LegalDocuments]
      operationId: createLegalDocument
      summary: Thêm văn bản hiện hành hoặc tạo dự thảo
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentCreate' }
            examples:
              in_force:
                summary: Văn bản hiện hành
                value:
                  kind: IN_FORCE
                  doc_type: NGHI_DINH
                  number: 168/2024/NĐ-CP
                  title: Quy định xử phạt vi phạm hành chính về trật tự, an toàn giao thông trong lĩnh vực giao thông đường bộ; trừ điểm, phục hồi điểm giấy phép lái xe
                  issuer: Chính phủ
                  issued_date: '2024-12-26'
                  effective_date: '2025-01-01'
              draft:
                summary: Dự thảo
                value:
                  kind: DRAFT
                  doc_type: NGHI_DINH
                  number: '[Dự thảo] sửa đổi NĐ 168/2024/NĐ-CP'
                  title: '[Tên dự thảo]'
                  issuer: '[Cơ quan chủ trì soạn thảo]'
      responses:
        '201':
          description: Đã tạo (status `EDITING`).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /legal-documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: getLegalDocument
      summary: Chi tiết metadata văn bản
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '304': { description: Không đổi so với `If-None-Match`. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [LegalDocuments]
      operationId: updateLegalDocument
      summary: Sửa metadata / chuyển trạng thái (OWNER)
      description: |
        State machine: `EDITING → FINALIZED → ARCHIVED` (không quay lại).
        Chỉ `EDITING` được sửa nội dung, upload file, gắn chỉ dẫn thay đổi. `kind` không đổi được.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/LegalDocumentUpdate' }
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentUpdate' }
            example: { status: FINALIZED }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [LegalDocuments]
      operationId: deleteLegalDocument
      summary: Xoá mềm văn bản (OWNER, chỉ khi `EDITING`)
      description: Văn bản hiện hành đang là đích của chỉ dẫn thay đổi ⇒ 409 `RESOURCE_IN_USE`.
      responses:
        '204': { description: Đã xoá. Gọi lại trả 404. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /legal-documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: getDocumentContent
      summary: Nội dung có cấu trúc (JSON TipTap) + mục lục
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '304': { description: Không đổi. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LegalDocuments]
      operationId: replaceDocumentContent
      summary: Thay toàn bộ nội dung (OWNER, văn bản `EDITING`)
      description: |
        Validate cấu trúc Chương/Mục/Điều/Khoản/Điểm, chuẩn hoá số thứ tự, tạo revision mới, tái sinh provisions
        (giữ `provision.id` nếu `path` không đổi) và trích dẫn chiếu dạng “điểm a khoản 4 Điều 6 Nghị định …”.
        Bắt buộc `If-Match` (thiếu ⇒ 428, lệch ⇒ 412). Xoá/đổi path của provision đang được chỉ dẫn thay đổi
        hoặc chế tài tham chiếu ⇒ 409 `RESOURCE_IN_USE`.
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentContentWrite' }
            example:
              message: Thêm Điều 1 sửa đổi
              doc:
                type: doc
                content:
                  - { type: legalHeading, attrs: { level: ARTICLE, number: '1', title: Sửa đổi, bổ sung một số điều của Nghị định … } }
                  - { type: legalHeading, attrs: { level: CLAUSE, number: '1' } }
                  - { type: paragraph, content: [ { type: text, text: 'Sửa đổi điểm a khoản 4 Điều 6 như sau: “[nội dung mới]”' } ] }
      responses:
        '200':
          description: Đã lưu; trả nội dung đã chuẩn hoá.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /legal-documents/{document_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: listDocumentRevisions
      summary: Lịch sử revision (mới nhất trước)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-documents/{document_id}/revisions/{revision_number}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: revision_number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [LegalDocuments]
      operationId: getDocumentRevision
      summary: Một revision kèm nội dung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-documents/{document_id}/provisions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Provisions]
      operationId: listDocumentProvisions
      summary: Cây / danh sách điều khoản của văn bản
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [tree, flat], default: flat }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ProvisionLevel' }
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          description: Bỏ qua khi `view=tree`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: OK. `view=tree` trả `data` là các node gốc có `children`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Source files ─────────────────────────────
  /legal-documents/{document_id}/source-files:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [SourceFiles]
      operationId: uploadSourceFile
      summary: Upload file gốc (PDF / DOCX / TXT, OWNER, văn bản `EDITING`)
      description: |
        `multipart/form-data`, field `file`, tối đa 20 MB. Kiểu file được xác minh bằng magic bytes.
        Trùng nội dung (cùng SHA-256) trong cùng văn bản ⇒ 409.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, contentMediaType: application/octet-stream }
      responses:
        '201':
          description: Đã upload.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [SourceFiles]
      operationId: listSourceFiles
      summary: Danh sách file gốc của văn bản
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (mới nhất trước)
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /source-files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [SourceFiles]
      operationId: getSourceFile
      summary: Metadata của file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [SourceFiles]
      operationId: deleteSourceFile
      summary: Xoá file (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /source-files/{file_id}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [SourceFiles]
      operationId: downloadSourceFile
      summary: Tải nội dung file gốc
      responses:
        '200':
          description: 'Nội dung nhị phân, kèm header Content-Disposition (attachment).'
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Provisions & references ─────────────────────────────
  /workspaces/{workspace_id}/provisions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Provisions]
      operationId: searchProvisions
      summary: Tìm điều khoản trong workspace (để chọn đích của chỉ dẫn thay đổi)
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: document_id
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          description: Chỉ điều khoản thuộc văn bản loại này.
          schema: { $ref: '#/components/schemas/DocumentKind' }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ProvisionLevel' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK (sắp xếp theo độ liên quan khi có `q`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provisions/{provision_id}:
    parameters:
      - $ref: '#/components/parameters/ProvisionId'
    get:
      tags: [Provisions]
      operationId: getProvision
      summary: Chi tiết điều khoản kèm trích dẫn chuẩn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /provisions/{provision_id}/references:
    parameters:
      - $ref: '#/components/parameters/ProvisionId'
    get:
      tags: [Provisions]
      operationId: listProvisionReferences
      summary: Dẫn chiếu tới (incoming) hoặc từ (outgoing) điều khoản này
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionReferenceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Provisions]
      operationId: createProvisionReference
      summary: Thêm dẫn chiếu thủ công từ điều khoản này tới điều khoản khác (OWNER)
      description: Dẫn chiếu được trích tự động khi lưu nội dung; endpoint này để bổ sung những dẫn chiếu parser bỏ sót.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionReferenceCreate' }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /provision-references/{reference_id}:
    parameters:
      - name: reference_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Provisions]
      operationId: deleteProvisionReference
      summary: Xoá dẫn chiếu thủ công (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Change instructions ─────────────────────────────
  /legal-documents/{document_id}/change-instructions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [ChangeInstructions]
      operationId: listChangeInstructions
      summary: Chỉ dẫn thay đổi của một dự thảo
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ChangeType' }
        - name: target_document_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeInstructionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ChangeInstructions]
      operationId: createChangeInstruction
      summary: Gắn chỉ dẫn thay đổi (OWNER, dự thảo `EDITING`)
      description: |
        `document_id` phải là dự thảo (`kind=DRAFT`), `target_provision_id` phải thuộc văn bản hiện hành (`kind=IN_FORCE`)
        cùng workspace ⇒ nếu không: 422. `draft_provision_id` phải thuộc chính dự thảo này.
        Hai chỉ dẫn xung khắc trên cùng một điều khoản đích (vd `REPEALS` và `AMENDS`) ⇒ 409 `CONFLICTING_INSTRUCTION`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeInstructionCreate' }
            example:
              type: AMENDS
              draft_provision_id: 2b7f6d0e-8a4c-4f1e-9b2a-0c1d2e3f4a5b
              target_provision_id: 7b1e4c1a-2f7e-4a0e-9a59-1f0a3b6c9d10
              note: Điều chỉnh khung phạt
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeInstruction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /change-instructions/{instruction_id}:
    parameters:
      - $ref: '#/components/parameters/InstructionId'
    get:
      tags: [ChangeInstructions]
      operationId: getChangeInstruction
      summary: Chi tiết chỉ dẫn thay đổi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeInstruction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ChangeInstructions]
      operationId: updateChangeInstruction
      summary: Sửa chỉ dẫn thay đổi (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeInstructionUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeInstruction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [ChangeInstructions]
      operationId: deleteChangeInstruction
      summary: Xoá chỉ dẫn thay đổi (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Impact report ─────────────────────────────
  /legal-documents/{document_id}/impact-report:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [ImpactReports]
      operationId: getImpactReport
      summary: Báo cáo tác động của dự thảo (singleton chỉ đọc, tính khi đọc)
      description: |
        Chỉ cho văn bản `kind=DRAFT` (khác ⇒ 422 `NOT_A_DRAFT`). Tổng hợp từ chỉ dẫn thay đổi, dẫn chiếu và chế tài:
        điều khoản/văn bản bị tác động, dẫn chiếu bị gãy hoặc cần rà soát, chế tài trước → sau, cảnh báo xung đột.
        `ETag` đổi khi dự thảo, chỉ dẫn, dẫn chiếu hoặc chế tài liên quan đổi ⇒ dùng `If-None-Match` để tránh tính lại.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: as_of
          in: query
          description: Ngày dùng để xác định điều khoản/chế tài “đang có hiệu lực” (mặc định hôm nay).
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
        '304': { description: Không đổi. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ───────────────────────────── Sanction rules ─────────────────────────────
  /provisions/{provision_id}/sanction-rules:
    parameters:
      - $ref: '#/components/parameters/ProvisionId'
    get:
      tags: [SanctionRules]
      operationId: listSanctionRules
      summary: Chế tài quy định tại điều khoản
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRuleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [SanctionRules]
      operationId: createSanctionRule
      summary: Gắn chế tài vào điều khoản (OWNER)
      description: '`fine_min_vnd ≤ fine_max_vnd`; `points_deducted` bắt buộc khi `point_deduction_applicability = APPLIES`; khoảng hiệu lực hợp lệ.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRuleCreate' }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /sanction-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SanctionRules]
      operationId: getSanctionRule
      summary: Chi tiết chế tài
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [SanctionRules]
      operationId: updateSanctionRule
      summary: Sửa chế tài (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRuleUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [SanctionRules]
      operationId: deleteSanctionRule
      summary: Xoá chế tài (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Diagrams ─────────────────────────────
  /workspaces/{workspace_id}/diagrams:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Diagrams]
      operationId: listDiagrams
      summary: Lược đồ trong workspace
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          description: 'Cho phép: `updated_at`, `title`. Mặc định `-updated_at`.'
          schema: { type: string, default: -updated_at }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (không kèm nodes/edges)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Diagrams]
      operationId: createDiagram
      summary: Tạo lược đồ (OWNER); có thể khởi tạo từ báo cáo tác động
      description: Có `from_draft_id` ⇒ server sinh sẵn node/edge từ báo cáo tác động của dự thảo đó, người dùng chỉnh tay sau.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramCreate' }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /diagrams/{diagram_id}:
    parameters:
      - $ref: '#/components/parameters/DiagramId'
    get:
      tags: [Diagrams]
      operationId: getDiagram
      summary: Xem lược đồ
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '304': { description: Không đổi. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Diagrams]
      operationId: updateDiagram
      summary: Lưu canvas / metadata (OWNER)
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramUpdate' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Diagrams]
      operationId: deleteDiagram
      summary: Xoá lược đồ (OWNER)
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Cookie phiên httpOnly do Better Auth đặt sau `POST /api/auth/sign-in/email`.
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token Better Auth (header `set-auth-token` khi đăng nhập).

  parameters:
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số phần tử mỗi trang (tối đa 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Fields:
      name: fields
      in: query
      description: Sparse fieldset, danh sách field cách nhau bởi dấu phẩy (luôn có `id`). Field không tồn tại ⇒ 400.
      schema: { type: string }
      example: 'id,number,title,status'
    Query:
      name: q
      in: query
      description: Từ khoá full-text (không phân biệt dấu / hoa thường).
      schema: { type: string, minLength: 1, maxLength: 200 }
    AsOf:
      name: as_of
      in: query
      description: Ngày xét hiệu lực (mặc định hôm nay, giờ Việt Nam).
      schema: { type: string, format: date }
    IfMatch:
      name: If-Match
      in: header
      description: ETag hiện tại; lệch ⇒ 412.
      schema: { type: string, example: W/"3" }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: ETag hiện tại (bắt buộc); thiếu ⇒ 428, lệch ⇒ 412.
      schema: { type: string, example: W/"7" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string, example: W/"7" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID do client sinh; retry cùng key trả lại response đã lưu (24h). Cùng key khác body ⇒ 409.
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProvisionId:
      name: provision_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstructionId:
      name: instruction_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiagramId:
      name: diagram_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    Location:
      description: URL của tài nguyên vừa tạo.
      schema: { type: string, format: uri-reference }
    ETag:
      description: Phiên bản tài nguyên (weak ETag).
      schema: { type: string, example: W/"8" }
    Link:
      description: 'RFC 8288 pagination links (`rel="next"`, `"prev"`, `"first"`, `"last"`).'
      schema: { type: string }
    RetryAfter:
      description: Số giây cần chờ trước khi thử lại.
      schema: { type: integer }
    WWWAuthenticate:
      schema: { type: string, example: Bearer realm="leximpact" }

  responses:
    BadRequest:
      description: Request sai cú pháp hoặc query/path param không hợp lệ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://leximpact.example/problems/invalid-query-parameter
            title: Invalid query parameter
            status: 400
            detail: page_size phải trong khoảng 1–100.
            instance: /api/v1/workspaces/9c1f…/legal-documents
            code: INVALID_QUERY_PARAMETER
            request_id: 01JDX3M8Q2N6
    Unauthorized:
      description: Chưa đăng nhập hoặc phiên không hợp lệ.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://leximpact.example/problems/unauthenticated
            title: Authentication required
            status: 401
            detail: Cần đăng nhập để truy cập tài nguyên này.
            instance: /api/v1/workspaces
            code: UNAUTHENTICATED
            request_id: 01JDX3M8Q2N6
    Forbidden:
      description: Là thành viên nhưng không đủ quyền (VIEWER cố ghi, hoặc thao tác chỉ dành cho OWNER).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://leximpact.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: Bạn chỉ có quyền xem workspace này.
            instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc/content
            code: FORBIDDEN
            request_id: 01JDX3M8Q2N6
    NotFound:
      description: Không tồn tại hoặc không phải thành viên của workspace chứa nó (ẩn sự tồn tại).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://leximpact.example/problems/resource-not-found
            title: Resource not found
            status: 404
            detail: Không tìm thấy văn bản.
            instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc
            code: RESOURCE_NOT_FOUND
            request_id: 01JDX3M8Q2N6
    Conflict:
      description: Xung đột trạng thái (trùng khoá, chuyển trạng thái sai, tài nguyên đang được dùng, chỉ dẫn xung khắc…).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            conflicting_instruction:
              value:
                type: https://leximpact.example/problems/conflicting-instruction
                title: Conflicting instruction
                status: 409
                detail: Điểm a khoản 4 Điều 6 đã có chỉ dẫn REPEALS trong dự thảo này.
                instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc/change-instructions
                code: CONFLICTING_INSTRUCTION
                request_id: 01JDX3M8Q2N6
            duplicate:
              value:
                type: https://leximpact.example/problems/duplicate-resource
                title: Duplicate resource
                status: 409
                detail: Số hiệu 168/2024/NĐ-CP đã tồn tại trong workspace.
                instance: /api/v1/workspaces/9c1f…/legal-documents
                code: DUPLICATE_RESOURCE
                request_id: 01JDX3M8Q2N6
    PreconditionFailed:
      description: '`If-Match` không khớp phiên bản hiện tại.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Thiếu header `If-Match`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Body vượt giới hạn (file 20 MB, nội dung 2 MB, lược đồ 500 node).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Content-Type hoặc kiểu file không được hỗ trợ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: JSON hợp lệ nhưng vi phạm schema hoặc business rule.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://leximpact.example/problems/invalid-provision-hierarchy
            title: Invalid provision hierarchy
            status: 422
            detail: Cấu trúc văn bản không hợp lệ.
            instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc/content
            code: INVALID_PROVISION_HIERARCHY
            request_id: 01JDX3M8Q2N6
            errors:
              - { field: 'doc.content[0]', code: ORPHAN_CLAUSE, message: Khoản 1 không nằm trong Điều nào. }
    TooManyRequests:
      description: Vượt rate limit.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───── Common ─────
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', example: VALIDATION_ERROR }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total_items: { type: integer, minimum: 0, example: 135 }
        total_pages: { type: integer, minimum: 0, example: 7 }
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    UserSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }

    # ───── Enums ─────
    MemberRole:
      type: string
      description: OWNER = đọc/ghi/chia sẻ; VIEWER = chỉ đọc.
      enum: [OWNER, VIEWER]
    DocumentKind:
      type: string
      description: IN_FORCE = văn bản hiện hành; DRAFT = dự thảo.
      enum: [IN_FORCE, DRAFT]
    DocType:
      type: string
      enum: [LUAT, NGHI_DINH, THONG_TU, QUYET_DINH, OTHER]
    DocumentStatus:
      type: string
      description: Vòng đời biên tập trong workspace. EDITING → FINALIZED → ARCHIVED.
      enum: [EDITING, FINALIZED, ARCHIVED]
    ProvisionLevel:
      type: string
      enum: [CHAPTER, SECTION, ARTICLE, CLAUSE, POINT]
    ChangeType:
      type: string
      description: AMENDS = sửa đổi; SUPPLEMENTS = bổ sung; REPLACES = thay thế; REPEALS = bãi bỏ.
      enum: [AMENDS, SUPPLEMENTS, REPLACES, REPEALS]
    VehicleType:
      type: string
      enum: [CAR, MOTORBIKE, TRACTOR, BICYCLE, PEDESTRIAN, OTHER]
    PointDeductionApplicability:
      type: string
      enum: [APPLIES, NOT_APPLICABLE, UNKNOWN]

    # ───── Users & workspaces ─────
    User:
      allOf:
        - type: object
          required: [id, email, display_name, email_verified]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            email: { type: string, format: email }
            display_name: { type: string }
            email_verified: { type: boolean }
        - $ref: '#/components/schemas/Timestamps'
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    Workspace:
      allOf:
        - type: object
          required: [id, name, owner, my_role, member_count]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            name: { type: string }
            owner: { $ref: '#/components/schemas/UserSummary' }
            my_role: { $ref: '#/components/schemas/MemberRole' }
            member_count: { type: integer, minimum: 1, readOnly: true }
        - $ref: '#/components/schemas/Timestamps'
    WorkspaceList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    MemberCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [VIEWER]
          description: 1.0.0 chỉ chia sẻ quyền xem.
    Member:
      type: object
      required: [user, role, added_at]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        role: { $ref: '#/components/schemas/MemberRole' }
        added_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Member' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Legal documents ─────
    LegalDocumentCreate:
      type: object
      additionalProperties: false
      required: [kind, doc_type, number, title, issuer]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string, minLength: 1, maxLength: 80, description: Số hiệu (unique trong workspace). }
        title: { type: string, minLength: 1, maxLength: 500 }
        issuer: { type: string, maxLength: 200 }
        issued_date: { type: [string, 'null'], format: date }
        effective_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
    LegalDocumentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: JSON Merge Patch — mọi field optional; `kind` không đổi được.
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 500 }
        issuer: { type: string, maxLength: 200 }
        issued_date: { type: [string, 'null'], format: date }
        effective_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/DocumentStatus' }
    LegalDocument:
      allOf:
        - type: object
          required: [id, workspace_id, kind, doc_type, number, title, issuer, status, current_revision, version]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            workspace_id: { type: string, format: uuid, readOnly: true }
            kind: { $ref: '#/components/schemas/DocumentKind' }
            doc_type: { $ref: '#/components/schemas/DocType' }
            number: { type: string }
            title: { type: string }
            issuer: { type: string }
            issued_date: { type: [string, 'null'], format: date }
            effective_date: { type: [string, 'null'], format: date }
            expiry_date: { type: [string, 'null'], format: date }
            status: { $ref: '#/components/schemas/DocumentStatus' }
            current_revision: { type: integer, minimum: 0, readOnly: true, description: 0 = chưa có nội dung. }
            version: { type: integer, minimum: 1, readOnly: true }
            article_count: { type: integer, minimum: 0, readOnly: true }
            change_instruction_count:
              type: integer
              minimum: 0
              readOnly: true
              description: Chỉ có với dự thảo.
            finalized_at: { type: [string, 'null'], format: date-time, readOnly: true }
        - $ref: '#/components/schemas/Timestamps'
    LegalDocumentList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LegalDocument' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Editor content (TipTap JSON) ─────
    EditorDoc:
      type: object
      description: |
        Tài liệu TipTap/ProseMirror. Danh sách phẳng các block; cấp bậc suy ra từ `legalHeading.attrs.level`.
        Node cho phép: `paragraph, legalHeading, bulletList, orderedList, listItem, table, tableRow, tableCell, hardBreak, text`.
      required: [type, content]
      properties:
        type: { type: string, const: doc }
        content:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/EditorNode' }
    EditorNode:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [paragraph, legalHeading, bulletList, orderedList, listItem, table, tableRow, tableCell, hardBreak, text]
        attrs:
          oneOf:
            - $ref: '#/components/schemas/LegalHeadingAttrs'
            - type: object
        text: { type: string }
        marks:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [bold, italic, underline] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorNode' }
    LegalHeadingAttrs:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number:
          type: [string, 'null']
          description: 'Do client đề xuất; server chuẩn hoá (Chương: I, II…; Mục/Điều/Khoản: 1, 2…; Điểm: a, b, c, d, đ, e…).'
          example: '4'
        title: { type: [string, 'null'], maxLength: 500 }
    DocumentContentWrite:
      type: object
      additionalProperties: false
      required: [doc]
      properties:
        doc: { $ref: '#/components/schemas/EditorDoc' }
        message: { type: string, maxLength: 200, description: Ghi chú cho revision. }
    DocumentContent:
      type: object
      required: [document_id, revision_number, doc, outline, updated_at]
      properties:
        document_id: { type: string, format: uuid }
        revision_number: { type: integer, minimum: 0 }
        doc: { $ref: '#/components/schemas/EditorDoc' }
        outline:
          type: array
          description: Mục lục sinh từ heading (Chương/Mục/Điều).
          items: { $ref: '#/components/schemas/OutlineItem' }
        updated_at: { type: string, format: date-time }
    OutlineItem:
      type: object
      required: [level, number, label]
      properties:
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number: { type: string }
        label: { type: string, example: 'Điều 6. Xử phạt …' }
        provision_id: { type: [string, 'null'], format: uuid }
    Revision:
      type: object
      required: [revision_number, created_at, created_by]
      properties:
        revision_number: { type: integer, minimum: 1 }
        message: { type: [string, 'null'] }
        created_by: { $ref: '#/components/schemas/UserSummary' }
        created_at: { type: string, format: date-time }
    RevisionDetail:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [doc]
          properties:
            doc: { $ref: '#/components/schemas/EditorDoc' }
    RevisionList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Revision' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Source files ─────
    SourceFile:
      type: object
      required: [id, document_id, original_filename, mime_type, format, size_bytes, sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        original_filename: { type: string, example: du-thao-sua-doi.pdf }
        mime_type:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain]
        format: { type: string, enum: [pdf, docx, txt] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }
    SourceFileList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SourceFile' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Provisions & references ─────
    ProvisionRef:
      type: object
      description: Tham chiếu gọn tới một điều khoản.
      required: [id, document_id, citation]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        citation: { type: string, example: điểm a khoản 4 Điều 6 Nghị định 168/2024/NĐ-CP }
    Provision:
      type: object
      required: [id, document_id, level, number, path, label, citation, text, ordinal]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number: { type: string, example: a }
        title: { type: [string, 'null'] }
        path: { type: string, example: dieu-6/khoan-4/diem-a }
        label: { type: string, example: Điểm a }
        citation: { type: string, example: điểm a khoản 4 Điều 6 Nghị định 168/2024/NĐ-CP }
        text: { type: string, description: Nội dung thuần văn bản (không gồm con). }
        ordinal: { type: integer, minimum: 0 }
        incoming_reference_count: { type: integer, minimum: 0, readOnly: true }
        breadcrumbs:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
        children:
          type: array
          description: Chỉ có khi `view=tree`.
          items: { $ref: '#/components/schemas/Provision' }
    ProvisionList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Provision' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ProvisionReferenceCreate:
      type: object
      additionalProperties: false
      required: [to_provision_id]
      properties:
        to_provision_id: { type: string, format: uuid }
        quote: { type: [string, 'null'], maxLength: 500, description: Đoạn văn chứa dẫn chiếu. }
    ProvisionReference:
      type: object
      required: [id, from, to, source, created_at]
      properties:
        id: { type: string, format: uuid }
        from: { $ref: '#/components/schemas/ProvisionRef' }
        to: { $ref: '#/components/schemas/ProvisionRef' }
        source:
          type: string
          enum: [EXTRACTED, MANUAL]
          description: EXTRACTED = trích tự động khi lưu nội dung; MANUAL = người dùng thêm.
        quote: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    ProvisionReferenceList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProvisionReference' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Change instructions ─────
    ChangeInstructionCreate:
      type: object
      additionalProperties: false
      required: [type, draft_provision_id, target_provision_id]
      properties:
        type: { $ref: '#/components/schemas/ChangeType' }
        draft_provision_id: { type: string, format: uuid, description: Điều khoản trong dự thảo chứa chỉ dẫn. }
        target_provision_id: { type: string, format: uuid, description: Điều khoản hiện hành bị tác động. }
        note: { type: [string, 'null'], maxLength: 1000 }
    ChangeInstructionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type: { $ref: '#/components/schemas/ChangeType' }
        target_provision_id: { type: string, format: uuid }
        note: { type: [string, 'null'], maxLength: 1000 }
    ChangeInstruction:
      allOf:
        - type: object
          required: [id, document_id, type, draft_provision, target_provision]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            document_id: { type: string, format: uuid, readOnly: true, description: Dự thảo chứa chỉ dẫn. }
            type: { $ref: '#/components/schemas/ChangeType' }
            draft_provision: { $ref: '#/components/schemas/ProvisionRef' }
            target_provision: { $ref: '#/components/schemas/ProvisionRef' }
            note: { type: [string, 'null'] }
        - $ref: '#/components/schemas/Timestamps'
    ChangeInstructionList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChangeInstruction' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Impact report ─────
    ImpactReport:
      type: object
      required: [document_id, as_of, generated_at, summary, items, warnings]
      properties:
        document_id: { type: string, format: uuid, description: Dự thảo được đánh giá. }
        as_of: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        summary:
          type: object
          required: [affected_provisions, affected_documents, broken_references, references_to_review, sanction_changes, conflicts]
          properties:
            affected_provisions: { type: integer, minimum: 0 }
            affected_documents: { type: integer, minimum: 0 }
            broken_references: { type: integer, minimum: 0, description: Dẫn chiếu tới điều khoản bị bãi bỏ/thay thế. }
            references_to_review: { type: integer, minimum: 0, description: Dẫn chiếu tới điều khoản bị sửa đổi. }
            sanction_changes: { type: integer, minimum: 0 }
            conflicts: { type: integer, minimum: 0 }
        items:
          type: array
          description: Mỗi phần tử là một điều khoản hiện hành bị tác động.
          items: { $ref: '#/components/schemas/ImpactItem' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImpactWarning' }
    ImpactItem:
      type: object
      required: [target_provision, changes, affected_references, sanction_changes]
      properties:
        target_provision: { $ref: '#/components/schemas/ProvisionRef' }
        changes:
          type: array
          items:
            type: object
            required: [instruction_id, type, draft_provision]
            properties:
              instruction_id: { type: string, format: uuid }
              type: { $ref: '#/components/schemas/ChangeType' }
              draft_provision: { $ref: '#/components/schemas/ProvisionRef' }
        affected_references:
          type: array
          description: Điều khoản khác đang dẫn chiếu tới điều khoản bị tác động.
          items:
            type: object
            required: [from_provision, status]
            properties:
              from_provision: { $ref: '#/components/schemas/ProvisionRef' }
              status:
                type: string
                enum: [BROKEN, NEEDS_REVIEW]
                description: BROKEN khi đích bị bãi bỏ/thay thế; NEEDS_REVIEW khi đích bị sửa đổi.
        sanction_changes:
          type: array
          items:
            type: object
            required: [rule_id, behavior, before]
            properties:
              rule_id: { type: string, format: uuid }
              behavior: { type: string }
              before: { $ref: '#/components/schemas/SanctionSnapshot' }
              after:
                description: null khi chế tài bị bãi bỏ; có giá trị khi dự thảo gắn chế tài mới cho điều khoản thay thế.
                oneOf:
                  - $ref: '#/components/schemas/SanctionSnapshot'
                  - type: 'null'
    ImpactWarning:
      type: object
      required: [code, message, provision_ids]
      properties:
        code:
          type: string
          enum: [CONFLICTING_INSTRUCTIONS, BROKEN_REFERENCE, TARGET_NOT_IN_FORCE, TARGET_ALREADY_REPEALED]
        message: { type: string }
        provision_ids:
          type: array
          items: { type: string, format: uuid }

    # ───── Sanction rules ─────
    SanctionSnapshot:
      type: object
      required: [fine_min_vnd, fine_max_vnd, point_deduction_applicability]
      properties:
        vehicle_type: { oneOf: [ { $ref: '#/components/schemas/VehicleType' }, { type: 'null' } ] }
        fine_min_vnd: { type: integer, minimum: 0 }
        fine_max_vnd: { type: integer, minimum: 0 }
        point_deduction_applicability: { $ref: '#/components/schemas/PointDeductionApplicability' }
        points_deducted: { type: [integer, 'null'], minimum: 1, maximum: 12 }
    AdditionalSanction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [LICENSE_SUSPENSION, VEHICLE_CONFISCATION, OTHER] }
        duration_months_min: { type: [integer, 'null'], minimum: 1 }
        duration_months_max: { type: [integer, 'null'], minimum: 1 }
        description: { type: [string, 'null'], maxLength: 1000 }
    SanctionRuleFields:
      type: object
      properties:
        behavior: { type: string, minLength: 1, maxLength: 500, description: Mô tả hành vi vi phạm. }
        vehicle_type: { oneOf: [ { $ref: '#/components/schemas/VehicleType' }, { type: 'null' } ] }
        fine_min_vnd: { type: integer, minimum: 0 }
        fine_max_vnd: { type: integer, minimum: 0 }
        point_deduction_applicability: { $ref: '#/components/schemas/PointDeductionApplicability' }
        points_deducted: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        additional_sanctions:
          type: array
          items: { $ref: '#/components/schemas/AdditionalSanction' }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        is_sample: { type: boolean, default: false, description: Dữ liệu mẫu, không phải số liệu pháp lý đã kiểm chứng. }
    SanctionRuleCreate:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
      required: [behavior, fine_min_vnd, fine_max_vnd, point_deduction_applicability]
      unevaluatedProperties: false
    SanctionRuleUpdate:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
      minProperties: 1
      unevaluatedProperties: false
    SanctionRule:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
        - type: object
          required: [id, provision, behavior, fine_min_vnd, fine_max_vnd, point_deduction_applicability]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            provision: { $ref: '#/components/schemas/ProvisionRef' }
        - $ref: '#/components/schemas/Timestamps'
    SanctionRuleList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SanctionRule' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Diagrams ─────
    DiagramNode:
      type: object
      additionalProperties: false
      required: [id, kind, label, position]
      properties:
        id: { type: string, maxLength: 64, description: ID phía client (React Flow). }
        kind: { type: string, enum: [DOCUMENT, PROVISION, NOTE] }
        ref_id: { type: [string, 'null'], format: uuid, description: ID văn bản/điều khoản được tham chiếu (null với NOTE). }
        label: { type: string, maxLength: 300 }
        position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        style:
          type: object
          description: Thuộc tính hiển thị — server không diễn giải.
        broken_ref: { type: boolean, readOnly: true, description: true nếu tài nguyên tham chiếu không còn tồn tại. }
    DiagramEdge:
      type: object
      additionalProperties: false
      required: [id, source, target]
      properties:
        id: { type: string, maxLength: 64 }
        source: { type: string, description: ID node nguồn. }
        target: { type: string, description: ID node đích. }
        relation_type:
          type: string
          enum: [AMENDS, SUPPLEMENTS, REPLACES, REPEALS, REFERENCES, CUSTOM]
          default: CUSTOM
        label: { type: [string, 'null'], maxLength: 200 }
    Viewport:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        zoom: { type: number, minimum: 0.05, maximum: 8 }
    DiagramCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        from_draft_id: { type: [string, 'null'], format: uuid, description: Khởi tạo node/edge từ báo cáo tác động của dự thảo này. }
        nodes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/DiagramNode' } }
        edges: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/DiagramEdge' } }
        viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        nodes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/DiagramNode' } }
        edges: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/DiagramEdge' } }
        viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramSummary:
      allOf:
        - type: object
          required: [id, workspace_id, title, node_count, edge_count, version]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            workspace_id: { type: string, format: uuid, readOnly: true }
            title: { type: string }
            description: { type: [string, 'null'] }
            node_count: { type: integer, minimum: 0 }
            edge_count: { type: integer, minimum: 0 }
            version: { type: integer, minimum: 1 }
        - $ref: '#/components/schemas/Timestamps'
    Diagram:
      allOf:
        - $ref: '#/components/schemas/DiagramSummary'
        - type: object
          required: [nodes, edges]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/DiagramNode' } }
            edges: { type: array, items: { $ref: '#/components/schemas/DiagramEdge' } }
            viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DiagramSummary' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
