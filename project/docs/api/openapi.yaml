openapi: 3.1.0
info:
  title: TrafficLex API
  version: 1.0.0
  summary: Tra cứu & biên tập chế tài xử phạt vi phạm giao thông đường bộ theo Điều/Khoản/Điểm.
  description: |
    API contract (design-first) của TrafficLex — bài tập lớn INT3505E_2, Nhóm 12.

    ## Quickstart
    1. Đăng ký: `POST /api/auth/sign-up/email` `{ "email", "password", "name" }` (Better Auth — xem `/api/auth/reference`).
    2. Đăng nhập: `POST /api/auth/sign-in/email` → nhận cookie phiên (SPA) **và** header `set-auth-token` (client khác).
    3. Gọi API với cookie hoặc `Authorization: Bearer <set-auth-token>`.
    4. Tạo văn bản `POST /legal-documents` → upload file gốc `POST /legal-documents/{id}/source-files` → `GET /legal-documents`.

    ## Workspace riêng cho mỗi tài khoản
    Mỗi tài khoản là một **instance/workspace độc lập**: văn bản, file, hành vi, chế tài, lược đồ đều thuộc về người tạo.
    Mọi endpoint `/api/v1` yêu cầu đăng nhập và **chỉ trả dữ liệu của workspace hiện tại**; tài nguyên của tài khoản khác
    trả `404` (không lộ sự tồn tại). Khoá nghiệp vụ (vd số hiệu văn bản) chỉ unique trong một workspace.

    ## Quy ước
    - JSON & query param dùng `snake_case`; path dùng `kebab-case`; enum `UPPER_SNAKE_CASE`.
    - Collection trả `{ data, pagination }`, phân trang `page` / `page_size` (≤ 100).
    - Lỗi trả `application/problem+json` (RFC 9457) với `code` ổn định cho máy đọc.
    - Tài nguyên soạn thảo (`content`, `diagrams`) dùng ETag + `If-Match` (optimistic concurrency).
    - Client phải bỏ qua field không biết (tolerant reader); v1 chỉ thay đổi theo hướng bổ sung.
  contact:
    name: Nhóm 12 — INT3505E_2
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Users
    description: Người dùng hiện tại (đăng ký/đăng nhập do Better Auth xử lý tại `/api/auth/*`).
  - name: LegalDocuments
    description: Văn bản pháp luật, nội dung soạn thảo (Điều/Khoản/Điểm), revision.
  - name: SourceFiles
    description: File gốc (PDF/DOCX/TXT) upload cho văn bản.
  - name: Provisions
    description: Điều khoản dẫn xuất từ nội dung văn bản (chỉ đọc).
  - name: DocumentRelations
    description: Quan hệ có hướng giữa các văn bản (association resource).
  - name: Violations
    description: Hành vi vi phạm giao thông.
  - name: SanctionRules
    description: Chế tài áp dụng cho hành vi, có căn cứ provision và khoảng hiệu lực.
  - name: Diagrams
    description: Lược đồ vẽ thủ công của người dùng.
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ───────────────────────────── Users ─────────────────────────────
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Người dùng đang đăng nhập (chủ workspace)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ───────────────────────────── Legal documents ─────────────────────────────
  /legal-documents:
    get:
      tags: [LegalDocuments]
      operationId: listLegalDocuments
      summary: Liệt kê / tìm văn bản
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Query'
        - name: doc_type
          in: query
          schema: { $ref: '#/components/schemas/DocType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: number
          in: query
          description: Lọc chính xác theo số hiệu.
          schema: { type: string, example: 168/2024/NĐ-CP }
        - name: issued_after
          in: query
          schema: { type: string, format: date }
        - name: issued_before
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: 'Cho phép: `issued_date`, `effective_date`, `number`, `created_at` (tiền tố `-` = giảm dần). Mặc định `-issued_date`.'
          schema: { type: string, default: -issued_date, example: -issued_date }
      responses:
        '200':
          description: OK
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [LegalDocuments]
      operationId: createLegalDocument
      summary: Tạo văn bản nháp
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentCreate' }
            example:
              doc_type: NGHI_DINH
              number: 168/2024/NĐ-CP
              title: Quy định xử phạt vi phạm hành chính về trật tự, an toàn giao thông trong lĩnh vực giao thông đường bộ
              issuer: Chính phủ
              issued_date: '2024-12-26'
              effective_date: '2025-01-01'
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /legal-documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: getLegalDocument
      summary: Chi tiết metadata văn bản
      parameters:
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '304': { description: Không đổi so với `If-None-Match`. }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [LegalDocuments]
      operationId: updateLegalDocument
      summary: Sửa metadata / chuyển trạng thái
      description: |
        State machine: `DRAFT → PUBLISHED → ARCHIVED` (không quay lại).
        Publish yêu cầu đủ `issued_date`, `effective_date` (và content có ≥ 1 Điều khi API-04 hoàn thành).
        Văn bản `PUBLISHED` chỉ được sửa `expiry_date`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/LegalDocumentUpdate' }
          application/json:
            schema: { $ref: '#/components/schemas/LegalDocumentUpdate' }
            example: { status: PUBLISHED }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [LegalDocuments]
      operationId: deleteLegalDocument
      summary: Xoá mềm văn bản DRAFT
      responses:
        '204': { description: Đã xoá. Gọi lại trả 404. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /legal-documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: getDocumentContent
      summary: Lấy nội dung soạn thảo (JSON TipTap)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '304': { description: Không đổi. }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [LegalDocuments]
      operationId: replaceDocumentContent
      summary: Thay toàn bộ nội dung (văn bản DRAFT)
      description: |
        Validate cấu trúc Chương/Mục/Điều/Khoản/Điểm, chuẩn hoá số thứ tự, tạo revision mới và tái sinh provisions.
        Bắt buộc `If-Match` (thiếu ⇒ 428, lệch ⇒ 412). Provision đang được chế tài tham chiếu bị xoá/đổi path ⇒ 409 `RESOURCE_IN_USE`.
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentContentWrite' }
            examples:
              nghi_dinh:
                summary: Một Điều có Khoản và Điểm
                value:
                  message: Thêm khoản 4 Điều 6
                  doc:
                    type: doc
                    content:
                      - { type: legalHeading, attrs: { level: ARTICLE, number: '6', title: Xử phạt người điều khiển xe ô tô vi phạm quy tắc giao thông đường bộ } }
                      - { type: legalHeading, attrs: { level: CLAUSE, number: '4' } }
                      - { type: paragraph, content: [ { type: text, text: 'Phạt tiền từ ... đến ... đối với người điều khiển xe thực hiện một trong các hành vi vi phạm sau đây:' } ] }
                      - { type: legalHeading, attrs: { level: POINT, number: a } }
                      - { type: paragraph, content: [ { type: text, text: 'Dừng xe, đỗ xe trên phần đường xe chạy ở đoạn đường ngoài đô thị nơi có lề đường rộng;' } ] }
      responses:
        '200':
          description: Đã lưu; trả content đã chuẩn hoá.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /legal-documents/{document_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments]
      operationId: listDocumentRevisions
      summary: Lịch sử revision
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (mới nhất trước)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-documents/{document_id}/revisions/{revision_number}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: revision_number
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [LegalDocuments]
      operationId: getDocumentRevision
      summary: Một revision kèm content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-documents/{document_id}/provisions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments, Provisions]
      operationId: listDocumentProvisions
      summary: Cây / danh sách provision của văn bản
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [tree, flat], default: flat }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ProvisionLevel' }
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          description: Bỏ qua khi `view=tree`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: OK. `view=tree` trả `data` là các node gốc có `children`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-documents/{document_id}/relations:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [LegalDocuments, DocumentRelations]
      operationId: listDocumentRelationsOfDocument
      summary: Quan hệ vào/ra của một văn bản
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing, both], default: both }
        - name: relation_type
          in: query
          schema: { $ref: '#/components/schemas/RelationType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRelationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /legal-documents/{document_id}/source-files:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [SourceFiles]
      operationId: uploadSourceFile
      summary: Upload file gốc của văn bản (PDF / DOCX / TXT)
      description: |
        `multipart/form-data`, field `file`. Tối đa 20 MB. Kiểu file được xác minh bằng magic bytes (không tin Content-Type).
        Chỉ nhận cho văn bản `DRAFT`. File có nội dung trùng (cùng SHA-256) trong cùng văn bản ⇒ 409.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, contentMediaType: application/octet-stream }
      responses:
        '201':
          description: Đã upload.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [SourceFiles]
      operationId: listSourceFiles
      summary: Danh sách file gốc của văn bản
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (mới nhất trước)
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /source-files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [SourceFiles]
      operationId: getSourceFile
      summary: Metadata của file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [SourceFiles]
      operationId: deleteSourceFile
      summary: Xoá file
      responses:
        '204': { description: Đã xoá. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /source-files/{file_id}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [SourceFiles]
      operationId: downloadSourceFile
      summary: Tải nội dung file gốc
      responses:
        '200':
          description: 'Nội dung nhị phân, kèm header Content-Disposition (attachment).'
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Provisions ─────────────────────────────
  /provisions:
    get:
      tags: [Provisions]
      operationId: listProvisions
      summary: Tìm kiếm điều khoản (full-text, không dấu)
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: document_id
          in: query
          schema: { type: string, format: uuid }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ProvisionLevel' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK (sắp xếp theo độ liên quan khi có `q`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /provisions/{provision_id}:
    parameters:
      - $ref: '#/components/parameters/ProvisionId'
    get:
      tags: [Provisions]
      operationId: getProvision
      summary: Chi tiết điều khoản kèm trích dẫn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provision' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Document relations ─────────────────────────────
  /document-relations:
    get:
      tags: [DocumentRelations]
      operationId: listDocumentRelations
      summary: Liệt kê quan hệ văn bản
      parameters:
        - name: document_id
          in: query
          description: Văn bản là source hoặc target.
          schema: { type: string, format: uuid }
        - name: relation_type
          in: query
          schema: { $ref: '#/components/schemas/RelationType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRelationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [DocumentRelations]
      operationId: createDocumentRelation
      summary: Tạo quan hệ văn bản
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRelationCreate' }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /document-relations/{relation_id}:
    parameters:
      - name: relation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [DocumentRelations]
      operationId: deleteDocumentRelation
      summary: Xoá quan hệ
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Violations ─────────────────────────────
  /violations:
    get:
      tags: [Violations]
      operationId: listViolations
      summary: Tìm hành vi vi phạm
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: vehicle_type
          in: query
          description: Chỉ hành vi có chế tài cho loại xe này (nhiều giá trị cách nhau bởi dấu phẩy).
          schema: { type: string, example: 'CAR,MOTORBIKE' }
        - name: has_point_deduction
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/AsOf'
        - name: sort
          in: query
          description: 'Cho phép: `name`, `created_at`, `relevance` (mặc định khi có `q`).'
          schema: { type: string, default: name }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: OK
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViolationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Violations]
      operationId: createViolation
      summary: Tạo hành vi
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViolationCreate' }
            example:
              slug: do-xe-tren-phan-duong-xe-chay-ngoai-do-thi
              name: Đỗ xe trên phần đường xe chạy ở đoạn đường ngoài đô thị
              keywords: [đỗ xe, dừng xe, ngoài đô thị]
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /violations/{violation_id}:
    parameters:
      - $ref: '#/components/parameters/ViolationId'
    get:
      tags: [Violations]
      operationId: getViolation
      summary: Chi tiết hành vi kèm chế tài hiện hành
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Violations]
      operationId: updateViolation
      summary: Sửa hành vi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViolationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Violations]
      operationId: deleteViolation
      summary: Xoá mềm hành vi — không được còn chế tài
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /violations/{violation_id}/sanction-rules:
    parameters:
      - $ref: '#/components/parameters/ViolationId'
    get:
      tags: [SanctionRules]
      operationId: listSanctionRules
      summary: Chế tài của hành vi (theo thời điểm)
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - name: vehicle_type
          in: query
          schema: { $ref: '#/components/schemas/VehicleType' }
        - name: status
          in: query
          description: Trạng thái tính tại `as_of`.
          schema: { $ref: '#/components/schemas/RuleStatus' }
        - name: sort
          in: query
          description: 'Cho phép: `effective_from`, `fine_max_vnd`. Mặc định `-effective_from`.'
          schema: { type: string, default: -effective_from }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRuleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [SanctionRules]
      operationId: createSanctionRule
      summary: Tạo chế tài
      description: |
        `fine_min_vnd ≤ fine_max_vnd`; `points_deducted` bắt buộc khi `point_deduction_applicability = APPLIES`, phải null khi khác.
        Khoảng hiệu lực không chồng lấn với rule khác cùng (`violation_id`, `vehicle_type`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRuleCreate' }
            example:
              provision_id: 7b1e4c1a-2f7e-4a0e-9a59-1f0a3b6c9d10
              vehicle_type: CAR
              fine_min_vnd: 0
              fine_max_vnd: 0
              point_deduction_applicability: UNKNOWN
              points_deducted: null
              additional_sanctions: []
              remedial_measures: []
              effective_from: '2025-01-01'
              effective_to: null
              is_sample: true
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /sanction-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SanctionRules]
      operationId: getSanctionRule
      summary: Chi tiết chế tài
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - name: expand
          in: query
          description: 'Nhúng tài nguyên liên quan. Cho phép: `provision`, `violation`.'
          schema: { type: string, example: provision }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [SanctionRules]
      operationId: updateSanctionRule
      summary: Sửa chế tài
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionRuleUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [SanctionRules]
      operationId: deleteSanctionRule
      summary: Xoá chế tài
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Diagrams ─────────────────────────────
  /diagrams:
    get:
      tags: [Diagrams]
      operationId: listDiagrams
      summary: Lược đồ trong workspace của tôi
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          description: 'Cho phép: `updated_at`, `title`. Mặc định `-updated_at`.'
          schema: { type: string, default: -updated_at }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (không kèm nodes/edges)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Diagrams]
      operationId: createDiagram
      summary: Tạo lược đồ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramCreate' }
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /diagrams/{diagram_id}:
    parameters:
      - $ref: '#/components/parameters/DiagramId'
    get:
      tags: [Diagrams]
      operationId: getDiagram
      summary: Xem lược đồ
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '304': { description: Không đổi. }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Diagrams]
      operationId: updateDiagram
      summary: Lưu canvas / metadata
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramUpdate' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagram' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Diagrams]
      operationId: deleteDiagram
      summary: Xoá lược đồ
      responses:
        '204': { description: Đã xoá. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Cookie phiên httpOnly do Better Auth đặt sau `POST /api/auth/sign-in/email` (dùng cho SPA).
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token Better Auth (header `set-auth-token` khi đăng nhập), dùng cho Postman / client ngoài trình duyệt.

  parameters:
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Số phần tử mỗi trang (tối đa 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Fields:
      name: fields
      in: query
      description: Sparse fieldset, danh sách field cách nhau bởi dấu phẩy (luôn có `id`). Field không tồn tại ⇒ 400.
      schema: { type: string, example: 'id,number,title,status' }
    Query:
      name: q
      in: query
      description: Từ khoá full-text (không phân biệt dấu / hoa thường).
      schema: { type: string, minLength: 1, maxLength: 200, example: đỗ xe }
    AsOf:
      name: as_of
      in: query
      description: Ngày tra cứu hiệu lực (mặc định hôm nay, giờ Việt Nam).
      schema: { type: string, format: date, example: '2025-06-01' }
    IfMatch:
      name: If-Match
      in: header
      description: ETag hiện tại; lệch ⇒ 412.
      schema: { type: string, example: W/"3" }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: ETag hiện tại (bắt buộc); thiếu ⇒ 428, lệch ⇒ 412.
      schema: { type: string, example: W/"7" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string, example: W/"7" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID do client sinh; retry cùng key trả lại response đã lưu (24h). Cùng key khác body ⇒ 409.
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProvisionId:
      name: provision_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViolationId:
      name: violation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DiagramId:
      name: diagram_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    Location:
      description: URL của tài nguyên vừa tạo.
      schema: { type: string, format: uri-reference }
    ETag:
      description: Phiên bản tài nguyên (weak ETag).
      schema: { type: string, example: W/"8" }
    Link:
      description: 'RFC 8288 pagination links (`rel="next"`, `"prev"`, `"first"`, `"last"`).'
      schema: { type: string }
    RetryAfter:
      description: Số giây cần chờ trước khi thử lại.
      schema: { type: integer }
    WWWAuthenticate:
      schema: { type: string, example: Bearer realm="trafficlex", error="invalid_token" }

  responses:
    BadRequest:
      description: Request sai cú pháp hoặc query param không hợp lệ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://trafficlex.example/problems/invalid-query-parameter
            title: Invalid query parameter
            status: 400
            detail: page_size phải trong khoảng 1–100.
            instance: /api/v1/violations
            code: INVALID_QUERY_PARAMETER
            request_id: 01JDX3M8Q2N6
    Unauthorized:
      description: Thiếu, sai hoặc hết hạn token / sai thông tin đăng nhập.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://trafficlex.example/problems/unauthenticated
            title: Authentication required
            status: 401
            detail: Thiếu hoặc sai access token.
            instance: /api/v1/legal-documents
            code: UNAUTHENTICATED
            request_id: 01JDX3M8Q2N6
    NotFound:
      description: Không tồn tại hoặc không có quyền xem.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://trafficlex.example/problems/resource-not-found
            title: Resource not found
            status: 404
            detail: Không tìm thấy văn bản.
            instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc
            code: RESOURCE_NOT_FOUND
            request_id: 01JDX3M8Q2N6
    Conflict:
      description: Xung đột trạng thái (trùng khoá, chuyển trạng thái sai, tài nguyên đang được dùng, idempotency key reuse).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            duplicate:
              value:
                type: https://trafficlex.example/problems/duplicate-resource
                title: Duplicate resource
                status: 409
                detail: Số hiệu 168/2024/NĐ-CP đã tồn tại.
                instance: /api/v1/legal-documents
                code: DUPLICATE_RESOURCE
                request_id: 01JDX3M8Q2N6
            transition:
              value:
                type: https://trafficlex.example/problems/invalid-state-transition
                title: Invalid state transition
                status: 409
                detail: Không thể chuyển từ PUBLISHED về DRAFT.
                instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc
                code: INVALID_STATE_TRANSITION
                request_id: 01JDX3M8Q2N6
    PreconditionFailed:
      description: '`If-Match` không khớp phiên bản hiện tại.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Thiếu header `If-Match`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Body vượt giới hạn (content 2 MB, diagram 500 node).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Content-Type hoặc kiểu file không được hỗ trợ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: JSON hợp lệ nhưng vi phạm schema hoặc business rule.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://trafficlex.example/problems/invalid-provision-hierarchy
            title: Invalid provision hierarchy
            status: 422
            detail: Cấu trúc văn bản không hợp lệ.
            instance: /api/v1/legal-documents/3f0c9a4e-1b2c-4d5e-8f90-123456789abc/content
            code: INVALID_PROVISION_HIERARCHY
            request_id: 01JDX3M8Q2N6
            errors:
              - { field: 'doc.content[0]', code: ORPHAN_CLAUSE, message: Khoản 1 không nằm trong Điều nào. }
    TooManyRequests:
      description: Vượt rate limit.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───── Common ─────
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', example: VALIDATION_ERROR }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total_items: { type: integer, minimum: 0, example: 135 }
        total_pages: { type: integer, minimum: 0, example: 7 }
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    # ───── Enums ─────
    DocType:
      type: string
      enum: [LUAT, NGHI_DINH, THONG_TU, QUYET_DINH, OTHER]
    DocumentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    ProvisionLevel:
      type: string
      enum: [CHAPTER, SECTION, ARTICLE, CLAUSE, POINT]
    RelationType:
      type: string
      enum: [AMENDS, SUPPLEMENTS, REPLACES, REPEALS, REFERENCES, GUIDES]
    VehicleType:
      type: string
      enum: [CAR, MOTORBIKE, TRACTOR, BICYCLE, PEDESTRIAN, OTHER]
    PointDeductionApplicability:
      type: string
      enum: [APPLIES, NOT_APPLICABLE, UNKNOWN]
    RuleStatus:
      type: string
      description: Tính tại `as_of`.
      enum: [CURRENT, SUPERSEDED, UPCOMING]

    # ───── Users ─────
    User:
      allOf:
        - type: object
          required: [id, email, display_name, email_verified]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            email: { type: string, format: email }
            display_name: { type: string }
            email_verified: { type: boolean }
        - $ref: '#/components/schemas/Timestamps'

    # ───── Legal documents ─────
    LegalDocumentCreate:
      type: object
      additionalProperties: false
      required: [doc_type, number, title, issuer]
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string, minLength: 1, maxLength: 50, example: 168/2024/NĐ-CP }
        title: { type: string, minLength: 1, maxLength: 500 }
        issuer: { type: string, maxLength: 200, example: Chính phủ }
        issued_date: { type: [string, 'null'], format: date }
        effective_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
    LegalDocumentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: JSON Merge Patch — mọi field optional.
      properties:
        doc_type: { $ref: '#/components/schemas/DocType' }
        number: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 500 }
        issuer: { type: string, maxLength: 200 }
        issued_date: { type: [string, 'null'], format: date }
        effective_date: { type: [string, 'null'], format: date }
        expiry_date: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/DocumentStatus' }
    LegalDocument:
      allOf:
        - type: object
          required: [id, doc_type, number, title, issuer, status, current_revision, version]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            doc_type: { $ref: '#/components/schemas/DocType' }
            number: { type: string }
            title: { type: string }
            issuer: { type: string }
            issued_date: { type: [string, 'null'], format: date }
            effective_date: { type: [string, 'null'], format: date }
            expiry_date: { type: [string, 'null'], format: date }
            status: { $ref: '#/components/schemas/DocumentStatus' }
            current_revision: { type: integer, minimum: 0, readOnly: true, description: 0 = chưa có nội dung. }
            version: { type: integer, minimum: 1, readOnly: true }
            article_count: { type: integer, minimum: 0, readOnly: true }
            published_at: { type: [string, 'null'], format: date-time, readOnly: true }
        - $ref: '#/components/schemas/Timestamps'
    LegalDocumentList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LegalDocument' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Source files ─────
    SourceFile:
      type: object
      required: [id, document_id, original_filename, mime_type, format, size_bytes, sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        original_filename: { type: string, example: Nghị định 168-2024.pdf }
        mime_type:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain]
        format: { type: string, enum: [pdf, docx, txt] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }
    SourceFileList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SourceFile' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Editor content (TipTap JSON) ─────
    EditorDoc:
      type: object
      description: |
        Tài liệu TipTap/ProseMirror. Danh sách phẳng các block; cấp bậc suy ra từ `legalHeading.attrs.level`.
        Node cho phép: `paragraph, legalHeading, bulletList, orderedList, listItem, table, tableRow, tableCell, hardBreak, text`.
      required: [type, content]
      properties:
        type: { type: string, const: doc }
        content:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/EditorNode' }
    EditorNode:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [paragraph, legalHeading, bulletList, orderedList, listItem, table, tableRow, tableCell, hardBreak, text]
        attrs:
          oneOf:
            - $ref: '#/components/schemas/LegalHeadingAttrs'
            - type: object
        text: { type: string }
        marks:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [bold, italic, underline] }
        content:
          type: array
          items: { $ref: '#/components/schemas/EditorNode' }
    LegalHeadingAttrs:
      type: object
      required: [level]
      properties:
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number:
          type: [string, 'null']
          description: 'Do client đề xuất; server chuẩn hoá (Chương: I, II…; Mục/Điều/Khoản: 1, 2…; Điểm: a, b, c, d, đ, e…).'
          example: '4'
        title: { type: [string, 'null'], maxLength: 500 }
    DocumentContentWrite:
      type: object
      additionalProperties: false
      required: [doc]
      properties:
        doc: { $ref: '#/components/schemas/EditorDoc' }
        message: { type: string, maxLength: 200, description: Ghi chú cho revision. }
    DocumentContent:
      type: object
      required: [document_id, revision_number, doc, outline, updated_at]
      properties:
        document_id: { type: string, format: uuid }
        revision_number: { type: integer, minimum: 0 }
        doc: { $ref: '#/components/schemas/EditorDoc' }
        outline:
          type: array
          description: Mục lục sinh từ heading (Chương/Mục/Điều).
          items: { $ref: '#/components/schemas/OutlineItem' }
        updated_at: { type: string, format: date-time }
    OutlineItem:
      type: object
      required: [level, number, label]
      properties:
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number: { type: string }
        label: { type: string, example: 'Điều 6. Xử phạt người điều khiển xe ô tô...' }
        provision_id: { type: [string, 'null'], format: uuid }
    Revision:
      type: object
      required: [revision_number, created_at]
      properties:
        revision_number: { type: integer, minimum: 1 }
        message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    RevisionDetail:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [doc]
          properties:
            doc: { $ref: '#/components/schemas/EditorDoc' }
    RevisionList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Revision' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Provisions ─────
    Provision:
      type: object
      required: [id, document_id, level, number, path, label, citation, text, ordinal]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        level: { $ref: '#/components/schemas/ProvisionLevel' }
        number: { type: string, example: a }
        title: { type: [string, 'null'] }
        path: { type: string, example: dieu-6/khoan-4/diem-a }
        label: { type: string, example: Điểm a }
        citation: { type: string, example: điểm a khoản 4 Điều 6 Nghị định 168/2024/NĐ-CP }
        text: { type: string, description: Nội dung thuần văn bản của provision (không gồm con). }
        ordinal: { type: integer, minimum: 0 }
        breadcrumbs:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
        children:
          type: array
          description: Chỉ có khi `view=tree`.
          items: { $ref: '#/components/schemas/Provision' }
    ProvisionList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Provision' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Document relations ─────
    DocumentRelationCreate:
      type: object
      additionalProperties: false
      required: [source_document_id, target_document_id, relation_type]
      properties:
        source_document_id: { type: string, format: uuid }
        target_document_id: { type: string, format: uuid }
        relation_type: { $ref: '#/components/schemas/RelationType' }
        source_provision_id: { type: [string, 'null'], format: uuid }
        target_provision_id: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 1000 }
    DocumentRelation:
      allOf:
        - $ref: '#/components/schemas/DocumentRelationCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
    DocumentRelationList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DocumentRelation' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Violations & sanctions ─────
    ViolationCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 5000 }
        keywords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
    ViolationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 5000 }
        keywords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
    SanctionSummary:
      type: object
      description: Tóm tắt chế tài hiện hành cho một loại xe (computed).
      required: [rule_id, vehicle_type, fine_min_vnd, fine_max_vnd, point_deduction_applicability, citation]
      properties:
        rule_id: { type: string, format: uuid }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        fine_min_vnd: { type: integer, minimum: 0 }
        fine_max_vnd: { type: integer, minimum: 0 }
        point_deduction_applicability: { $ref: '#/components/schemas/PointDeductionApplicability' }
        points_deducted: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        citation: { type: string }
    Violation:
      allOf:
        - type: object
          required: [id, slug, name, keywords, current_sanctions]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            slug: { type: string }
            name: { type: string }
            description: { type: [string, 'null'] }
            keywords: { type: array, items: { type: string } }
            current_sanctions:
              type: array
              readOnly: true
              description: Chế tài có hiệu lực tại `as_of`, mỗi loại xe một phần tử.
              items: { $ref: '#/components/schemas/SanctionSummary' }
        - $ref: '#/components/schemas/Timestamps'
    ViolationList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Violation' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    AdditionalSanction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [LICENSE_SUSPENSION, VEHICLE_CONFISCATION, OTHER] }
        duration_months_min: { type: [integer, 'null'], minimum: 1 }
        duration_months_max: { type: [integer, 'null'], minimum: 1 }
        description: { type: [string, 'null'], maxLength: 1000 }
    SanctionRuleFields:
      type: object
      properties:
        provision_id: { type: string, format: uuid, description: Căn cứ pháp lý (bắt buộc khi tạo). }
        vehicle_type: { $ref: '#/components/schemas/VehicleType' }
        fine_min_vnd: { type: integer, minimum: 0, example: 0 }
        fine_max_vnd: { type: integer, minimum: 0, example: 0 }
        point_deduction_applicability: { $ref: '#/components/schemas/PointDeductionApplicability' }
        points_deducted: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        additional_sanctions:
          type: array
          items: { $ref: '#/components/schemas/AdditionalSanction' }
        remedial_measures:
          type: array
          items: { type: string, maxLength: 1000 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        is_sample: { type: boolean, default: false, description: Đánh dấu dữ liệu mẫu (không phải số liệu pháp lý đã kiểm chứng). }
    SanctionRuleCreate:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
      required: [provision_id, vehicle_type, fine_min_vnd, fine_max_vnd, point_deduction_applicability, effective_from]
      unevaluatedProperties: false
    SanctionRuleUpdate:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
      minProperties: 1
      unevaluatedProperties: false
    SanctionRule:
      allOf:
        - $ref: '#/components/schemas/SanctionRuleFields'
        - type: object
          required: [id, violation_id, provision_id, vehicle_type, fine_min_vnd, fine_max_vnd, point_deduction_applicability, effective_from, status, citation]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            violation_id: { type: string, format: uuid, readOnly: true }
            status: { $ref: '#/components/schemas/RuleStatus' }
            citation: { type: string, readOnly: true, example: điểm a khoản 4 Điều 6 Nghị định 168/2024/NĐ-CP }
            provision: { $ref: '#/components/schemas/Provision', description: Chỉ có khi `expand=provision`. }
            violation: { $ref: '#/components/schemas/Violation', description: Chỉ có khi `expand=violation`. }
        - $ref: '#/components/schemas/Timestamps'
    SanctionRuleList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SanctionRule' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ───── Diagrams ─────
    DiagramNode:
      type: object
      additionalProperties: false
      required: [id, kind, label, position]
      properties:
        id: { type: string, maxLength: 64, description: ID phía client (React Flow). }
        kind: { type: string, enum: [DOCUMENT, PROVISION, VIOLATION, NOTE] }
        ref_id: { type: [string, 'null'], format: uuid, description: ID tài nguyên được tham chiếu (null với NOTE). }
        label: { type: string, maxLength: 300 }
        position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        style:
          type: object
          description: Thuộc tính hiển thị (màu, kích thước) — server không diễn giải.
        broken_ref: { type: boolean, readOnly: true, description: true nếu tài nguyên tham chiếu không còn tồn tại. }
    DiagramEdge:
      type: object
      additionalProperties: false
      required: [id, source, target]
      properties:
        id: { type: string, maxLength: 64 }
        source: { type: string, description: ID node nguồn. }
        target: { type: string, description: ID node đích. }
        relation_type:
          type: string
          enum: [AMENDS, SUPPLEMENTS, REPLACES, REPEALS, REFERENCES, GUIDES, CUSTOM]
          default: CUSTOM
        label: { type: [string, 'null'], maxLength: 200 }
    Viewport:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        zoom: { type: number, minimum: 0.05, maximum: 8 }
    DiagramCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        nodes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/DiagramNode' } }
        edges: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/DiagramEdge' } }
        viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        nodes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/DiagramNode' } }
        edges: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/DiagramEdge' } }
        viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramSummary:
      allOf:
        - type: object
          required: [id, title, node_count, edge_count, version]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            title: { type: string }
            description: { type: [string, 'null'] }
            node_count: { type: integer, minimum: 0 }
            edge_count: { type: integer, minimum: 0 }
            version: { type: integer, minimum: 1 }
        - $ref: '#/components/schemas/Timestamps'
    Diagram:
      allOf:
        - $ref: '#/components/schemas/DiagramSummary'
        - type: object
          required: [nodes, edges]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/DiagramNode' } }
            edges: { type: array, items: { $ref: '#/components/schemas/DiagramEdge' } }
            viewport: { $ref: '#/components/schemas/Viewport' }
    DiagramList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DiagramSummary' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
