openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ
servers:
  - url: http://localhost:5000/v1
tags:
  - name: tasks
paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      responses:
        '200':
          description: Danh sách task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/ServerError'
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [tasks]
      operationId: getTaskById
      responses:
        '200':
          description: Chi tiết task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
